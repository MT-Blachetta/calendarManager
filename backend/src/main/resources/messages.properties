# API messages (English, default). German: messages_de.properties.
# Messages with arguments use java.text.MessageFormat: write '' for a single quote.

# problem detail titles
error.title.notFound=Not found
error.title.conflict=Conflict
error.title.businessRule=Business rule violated
error.title.integrity=Data integrity violation
error.title.badRequest=Bad request
error.title.validation=Validation failed

# resource names (argument of error.notFound / error.versionConflict)
resource.tag=Tag
resource.category=Category
resource.parentCategory=Parent category
resource.event=Event
resource.view=View
resource.calendarView=View

# general
error.notFound={0} {1} not found
error.versionConflict={0} {1} was modified by someone else (version {2}, expected {3}). Reload and try again.
error.optimisticLock=The record was modified by someone else. Reload and try again.
error.integrity=The change violates a database constraint (e.g. a duplicate name).
error.validation=One or more fields are invalid.
error.sort=sort must be one of {0}
error.zone=Unknown time zone ''{0}''
error.range.toAfterFrom='to' must be after 'from'
error.range.toNotBeforeFrom='to' must not be before 'from'
error.range.maxDays=The range must not exceed {0} days

# tags
error.tag.duplicate=A tag named ''{0}'' already exists

# categories
error.category.duplicate=A category named ''{0}'' already exists at this level
error.category.abstractNoEvents=Category ''{0}'' is a group and cannot hold events; choose a calendar
error.category.hasChildren=Category ''{0}'' has sub-categories and must stay a group
error.category.hasEvents=Calendar ''{0}'' still has events; delete or move them before making it a group
error.category.cycle=A category cannot be moved below itself or one of its descendants
error.category.notEmpty=The category has {0} sub-categories and {1} events; delete with cascade=true to remove them all
error.category.parentIsCalendar=Parent ''{0}'' is a calendar; only groups can contain sub-categories

# events
error.event.endAfterStart=The end of an event must be after its start

# views
error.view.duplicate=A view named ''{0}'' already exists
error.view.systemDelete=The system view ''{0}'' cannot be deleted
error.view.systemFilter=The filter of the system view cannot be changed
error.view.includeEmpty=An include view needs at least one category or tag
error.view.exceptOnlyInExclude=Exception tags are only allowed in exclude views
error.view.tagHiddenAndExcept=A tag cannot be both hidden and an exception

# bean validation (referenced as "{validation.hexColor}" in constraint annotations)
validation.hexColor=must be a hex color like #4F46E5
